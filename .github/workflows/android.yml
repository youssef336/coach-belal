# Android: builds a signed APK and attaches it to a GitHub Release.
# Download it on the phone from the Releases page and install.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.CB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          CB_KEYSTORE_PASSWORD: ${{ secrets.CB_KEYSTORE_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk coach-belal.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Coach Belal (build ${{ github.run_number }})
          body: نزّل coach-belal.apk على تلفونك وسطّبه.
          files: coach-belal.apk
          make_latest: true
